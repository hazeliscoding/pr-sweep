name: Release

# Pushing a v* tag builds the Windows installer + portable exe and the Linux
# AppImage, then publishes one GitHub release with all of them. latest.yml and
# latest-linux.yml (+ blockmaps) are what electron-updater reads to self-update
# installed copies — they must ship with every release.
#
# The release body is the hand-written docs/releases/<tag>.md. A tag without
# one fails before anything builds: every release says what changed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes exist
        run: |
          f="docs/releases/${{ github.ref_name }}.md"
          if [ ! -s "$f" ]; then
            echo "::error file=$f::Missing $f. Every release needs hand-written notes (see AGENTS.md > Releases)."
            exit 1
          fi

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          # --ignore-scripts: the root postinstall would npm install the folders below a
          # second time, without their lockfiles' exact versions.
          npm ci --ignore-scripts
          (cd desktop && npm ci)
          (cd desktop/renderer && npm ci)
      - name: Build
        run: npm run build
      - name: Package
        shell: bash
        run: cd desktop && npx electron-builder --${{ matrix.target }} --publish never
        env:
          # Azure Trusted Signing (Windows leg only; ignored on Linux). electron-builder
          # authenticates via EnvironmentCredential and auto-installs the TrustedSigning
          # PowerShell module on the runner. See desktop/package.json > build.win.azureSignOptions.
          # Signing runs before latest.yml is generated, so update hashes stay valid.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.blockmap
            desktop/release/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "PR Sweep ${{ github.ref_name }}" \
            --notes-file "docs/releases/${{ github.ref_name }}.md"
