name: Release

# Pushing a v* tag builds the Windows installer + portable exe and publishes a
# GitHub release with them. latest.yml (+ blockmap) is what electron-updater
# reads to self-update installed copies — it must ship with every release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          (cd desktop && npm ci)
          (cd desktop/renderer && npm ci)
      - name: Build
        run: npm run build
      - name: Package
        shell: bash
        run: cd desktop && npx electron-builder --win --publish never
        env:
          # Azure Trusted Signing — electron-builder authenticates via
          # EnvironmentCredential and auto-installs the TrustedSigning PowerShell
          # module on the runner. See desktop/package.json > build.win.azureSignOptions.
          # Signing runs before latest.yml is generated, so update hashes stay valid.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            desktop/release/*.exe \
            desktop/release/*.blockmap \
            desktop/release/latest.yml \
            --title "${{ github.ref_name }}" \
            --generate-notes
