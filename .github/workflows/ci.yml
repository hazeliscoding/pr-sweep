name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          # --ignore-scripts: the root postinstall would npm install the folders below a
          # second time, without their lockfiles' exact versions.
          npm ci --ignore-scripts
          (cd desktop && npm ci)
          (cd desktop/renderer && npm ci)
      # Renderer AOT build + main-process tsc together are the typecheck.
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      # WCAG AA on the Quorum tokens, and no remote assets or stray fonts in the renderer.
      - name: Design checks
        run: npm run check
      # The built app in each fixture state, on a virtual display. No token needed.
      - name: End-to-end tests
        run: xvfb-run -a npm run test:e2e
      - name: Fixture screenshots
        working-directory: desktop
        run: xvfb-run -a node e2e/screenshot.mjs --fixtures
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-screenshots
          path: desktop/e2e/shots/
